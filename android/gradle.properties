org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The Pub cache (C:) and this project (D:) live on different drives. Kotlin's
# incremental compiler stores relative paths and crashes computing one across
# drive roots ("this and base files have different roots"). Disable it.
kotlin.incremental=false
